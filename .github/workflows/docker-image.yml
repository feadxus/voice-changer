name: Build Voice Changer Offline

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:

      - name: 📦 Checkout Workflow Repo
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 🔧 Install System Packages
        run: |
          sudo apt update
          sudo apt install -y \
            ffmpeg \
            espeak \
            libsndfile1-dev \
            git

      - name: 📥 Clone voice changer
        run: |
          git clone \
            -b master \
            https://github.com/feadxus/voice-changer.git

      - name: 📦 Install Python deps
        working-directory: voice-changer/server
        run: |
          python -m pip install --upgrade pip==23.2.1
          pip install "setuptools<60.0.0" wheel "Cython<3.0.0"
          pip install numpy==1.23.5
          pip install omegaconf==2.0.6
          pip install hydra-core==1.0.7
          pip install fairseq==0.12.2 --no-deps
          pip install pyworld==0.3.3 --no-build-isolation
          pip install -r requirements.txt
          pip cache purge

      # 1. 先编译底层的基础核心库 lib
      - name: 🌐 Build client lib
        working-directory: voice-changer/client/lib
        run: |
          npm install
          npm run build:prod

      # 2. 再编译包含界面的网页端应用程序 demo
      - name: 🌐 Build and Localize client demo
        working-directory: voice-changer/client/demo
        run: |
          # 执行安装，此时会自动触发上面的 postinstall 脚本，安全抓取全套 7 个离线大模型
          npm install
          
          # 运行作者原装的命令，建立基础依赖混入
          npm run copy:chime
          
          # 🚨 纠错核心：强行拦截 demo 模块引用的官方 Chime 域名，使其重定向到本地相对路径
          find node_modules/amazon-chime-sdk-js/build -type f -exec sed -i 's|https://chime.aws||g' {} +
          
          # 正式执行打包编译，把离线逻辑完美注入 index.js
          npm run build:prod

      # 3. 自动化闭环校验（绝不容忍空气包）
      - name: 🔍 Verify Local Modifications & Assets
        working-directory: voice-changer
        run: |
          echo "================ 1. 检查 TS 源码修改 ================"
          if grep -q "estimator" client/lib/src/VoiceChangerClient.ts; then
            echo "✅ TS 源码修改成功！"
          else
            echo "❌ 错误：VoiceChangerClient.ts 未检测到 paths 修改！"
            exit 1
          fi

          echo "================ 2. 检查 7 大离线文件完整性 ================"
          if [ -f "client/demo/public/chime/voicefocus-v1.model" ] && \
             [ -f "client/demo/public/chime/estimator-v1.js" ] && \
             [ -f "client/demo/public/chime/voicefocus-v1.json" ]; then
            echo "🎉 真正的 AI 大模型与 Worker 脚本已全部在 public/chime 物理集齐！"
            ls -la client/demo/public/chime/
          else
            echo "❌ 错误：离线资产依然缺失，闭环失败！"
            exit 1
          fi

      - name: 📦 Prepare package
        run: |
          mkdir release
          cp -r voice-changer release/

      - name: 🗜️ Compress
        run: |
          tar -cf voice-changer.tar release
          xz -T0 -9e voice-changer.tar

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-changer
          path: voice-changer.tar.xz

      - name: ☁️ Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: 🔑 rclone config
        env:
          RCLONE_SECRET_DATA: ${{ secrets.GOOGLE_FEADXUS_DRIVE }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_SECRET_DATA" > ~/.config/rclone/rclone.conf

      - name: 🚀 Upload Drive
        run: |
          rclone mkdir feadxus-Google-Drive:/voice-changer
          rclone copy voice-changer.tar.xz feadxus-Google-Drive:/voice-changer/

      - name: ✅ Verify Upload
        run: |
          rclone lsf feadxus-Google-Drive:/voice-changer/
