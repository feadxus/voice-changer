name: Build Voice Changer Offline

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:

      - name: 📦 Checkout Workflow Repo
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 🔧 Install System Packages
        run: |
          sudo apt update
          sudo apt install -y \
            ffmpeg \
            espeak \
            libsndfile1-dev \
            git

      - name: 📥 Clone voice changer
        run: |
          git clone \
            -b master \
            https://github.com/feadxus/voice-changer.git

      - name: 📦 Install Python deps
        working-directory: voice-changer/server
        run: |
          python -m pip install --upgrade pip==23.2.1
          pip install "setuptools<60.0.0" wheel "Cython<3.0.0"
          pip install numpy==1.23.5
          pip install omegaconf==2.0.6
          pip install hydra-core==1.0.7
          pip install fairseq==0.12.2 --no-deps
          pip install pyworld==0.3.3 --no-build-isolation
          pip install -r requirements.txt
          pip cache purge

      - name: 🌐 Build client lib
        working-directory: voice-changer/client/lib
        run: |
          npm install
          npm run build:prod

      # 先编译 demo 生成基础 dist，再补全 Chime 离线资源
      - name: 🌐 Build client demo
        working-directory: voice-changer/client/demo
        run: |
          npm install
          npm run build:prod

      # 📁 递归提取 node_modules 里的所有 Chime 资源，平铺 + 子目录双重兼容
      - name: 📁 Copy & Complete Chime Offline Assets
        working-directory: voice-changer
        run: |
          # 1. 创建双重兼容目录结构
          mkdir -p client/demo/dist/chime/workers client/demo/public/chime/workers

          # 2. 自动定位 amazon-chime-sdk-js 目录并递归抽取所有 .wasm 和 .js 资源
          CHIME_PKG_DIR=$(find . -type d -path "*/amazon-chime-sdk-js" | head -n 1)
          if [ -n "$CHIME_PKG_DIR" ]; then
            echo "✅ 找到 Chime SDK 包路径: $CHIME_PKG_DIR"
            # 同步所有静态文件到 chime 根目录与 workers/ 子目录
            find $CHIME_PKG_DIR -type f \( -name "*.wasm" -o -name "*.js" \) -exec cp {} client/demo/dist/chime/ \;
            find $CHIME_PKG_DIR -type f \( -name "*.wasm" -o -name "*.js" \) -exec cp {} client/demo/dist/chime/workers/ \;
            find $CHIME_PKG_DIR -type f \( -name "*.wasm" -o -name "*.js" \) -exec cp {} client/demo/public/chime/ \;
            find $CHIME_PKG_DIR -type f \( -name "*.wasm" -o -name "*.js" \) -exec cp {} client/demo/public/chime/workers/ \;
          else
            echo "❌ 未找到 amazon-chime-sdk-js 包，请检查 npm install！"
            exit 1
          fi

          # 3. 补充官方 CDN Worker 脚本（同时放入根目录与 workers 目录）
          echo "⬇️ 下载并补全 estimator-v1.js..."
          curl -sSL "https://static.sdkassets.chime.aws/workers/estimator-v1.js" -o client/demo/dist/chime/workers/estimator-v1.js
          cp client/demo/dist/chime/workers/estimator-v1.js client/demo/dist/chime/estimator-v1.js
          cp client/demo/dist/chime/workers/estimator-v1.js client/demo/public/chime/workers/estimator-v1.js
          cp client/demo/dist/chime/workers/estimator-v1.js client/demo/public/chime/estimator-v1.js

      - name: 🔍 Verify Local Modifications & Assets
        working-directory: voice-changer
        run: |
          echo "================ 1. 检查 TS 源码修改 ================"
          if grep -q "estimator" client/lib/src/VoiceChangerClient.ts; then
            echo "✅ TS 源码修改成功！包含了 paths 配置。"
          else
            echo "❌ 错误：VoiceChangerClient.ts 未检测到修改！"
            exit 1
          fi

          echo "================ 2. 打印并校验 dist/chime 离线资源清单 ================"
          echo "📂 client/demo/dist/chime 中的真实文件结构："
          find client/demo/dist/chime -type f

          # 验证核心文件存在
          if [ -f "client/demo/dist/chime/workers/estimator-v1.js" ] && [ -n "$(find client/demo/dist/chime -name '*.wasm')" ]; then
            echo "✅ 离线资源文件已全部集齐！"
          else
            echo "❌ 错误：未能在 dist/chime 中完整准备好离线文件！"
            exit 1
          fi

      - name: 📦 Prepare package
        run: |
          mkdir release
          cp -r voice-changer release/

      - name: 🗜️ Compress
        run: |
          tar -cf voice-changer.tar release
          xz -T0 -9e voice-changer.tar

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-changer
          path: voice-changer.tar.xz

      - name: ☁️ Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: 🔑 rclone config
        env:
          RCLONE_SECRET_DATA: ${{ secrets.GOOGLE_FEADXUS_DRIVE }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_SECRET_DATA" > ~/.config/rclone/rclone.conf

      - name: 🚀 Upload Drive
        run: |
          rclone mkdir feadxus-Google-Drive:/voice-changer
          rclone copy voice-changer.tar.xz feadxus-Google-Drive:/voice-changer/

      - name: ✅ Verify Upload
        run: |
          rclone lsf feadxus-Google-Drive:/voice-changer/
