name: Build Voice Changer Offline

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:

      - name: 📦 Checkout Workflow Repo
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 🔧 Install System Packages
        run: |
          sudo apt update
          sudo apt install -y \
            ffmpeg \
            espeak \
            libsndfile1-dev \
            git

      - name: 📥 Clone voice changer
        run: |
          git clone \
            -b master \
            https://github.com/feadxus/voice-changer.git

      - name: 📦 Install Python deps
        working-directory: voice-changer/server
        run: |
          python -m pip install --upgrade pip==23.2.1
          pip install "setuptools<60.0.0" wheel "Cython<3.0.0"
          pip install numpy==1.23.5
          pip install omegaconf==2.0.6
          pip install hydra-core==1.0.7
          pip install fairseq==0.12.2 --no-deps
          pip install pyworld==0.3.3 --no-build-isolation
          pip install -r requirements.txt
          pip cache purge

      - name: 🌐 Build client lib
        working-directory: voice-changer/client/lib
        run: |
          npm install
          npm run build:prod

      - name: 🌐 Build client demo
        working-directory: voice-changer/client/demo
        run: |
          npm install
          npm run build:prod

      # 📁 替换后的纯本地资源提取步骤（剔除 curl）
      - name: 📁 Copy Chime Assets (100% Offline)
        working-directory: voice-changer
        run: |
          mkdir -p client/demo/dist/chime/workers client/demo/public/chime/workers

          SYS_WORKERS=$(find . -type d -path "*/amazon-chime-sdk-js/sys/workers" | head -n 1)
          VOICE_FOCUS=$(find . -type d -path "*/amazon-chime-sdk-js/libs/voicefocus" | head -n 1)

          if [ -n "$SYS_WORKERS" ] && [ -n "$VOICE_FOCUS" ]; then
            cp -r $SYS_WORKERS/* client/demo/dist/chime/workers/
            cp -r $SYS_WORKERS/* client/demo/public/chime/workers/
            cp -r $VOICE_FOCUS/* client/demo/dist/chime/
            cp -r $VOICE_FOCUS/* client/demo/public/chime/
            echo "✅ 已成功从本地 node_modules 提取全套 Chime 离线资源！"
          else
            echo "❌ 未找到 Chime 资源目录，请检查 npm install 状态"
            exit 1
          fi

      - name: 🔍 Verify Local Modifications & Assets
        working-directory: voice-changer
        run: |
          echo "================ 1. 检查 VoiceChangerClient.ts 源码修改 ================"
          if grep -qE "paths|assetGroup" client/lib/src/VoiceChangerClient.ts; then
            echo "✅ TS 源码修改成功！包含了本地路径/assetGroup 配置。"
          else
            echo "❌ 错误：VoiceChangerClient.ts 未检测到修改！"
            exit 1
          fi

          echo "================ 2. 检查 Chime 本地静态资源拷贝 ================"
          if [ -f "client/demo/dist/chime/workers/estimator-v1.js" ]; then
            echo "✅ 离线文件全部准备就绪！"
            ls -la client/demo/dist/chime/workers/
          else
            echo "❌ 错误：未找到 estimator-v1.js 文件！"
            exit 1
          fi

      - name: 📦 Prepare package
        run: |
          mkdir release
          cp -r voice-changer release/

      - name: 🗜️ Compress
        run: |
          tar -cf voice-changer.tar release
          xz -T0 -9e voice-changer.tar

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-changer
          path: voice-changer.tar.xz

      - name: ☁️ Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: 🔑 rclone config
        env:
          RCLONE_SECRET_DATA: ${{ secrets.GOOGLE_FEADXUS_DRIVE }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_SECRET_DATA" > ~/.config/rclone/rclone.conf

      - name: 🚀 Upload Drive
        run: |
          rclone mkdir feadxus-Google-Drive:/voice-changer
          rclone copy voice-changer.tar.xz feadxus-Google-Drive:/voice-changer/

      - name: ✅ Verify Upload
        run: |
          rclone lsf feadxus-Google-Drive:/voice-changer/
