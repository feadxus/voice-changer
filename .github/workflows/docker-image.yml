name: Build Voice Changer Offline

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:

      - name: 📦 Checkout Workflow Repo
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 🔧 Install System Packages
        run: |
          sudo apt update
          sudo apt install -y \
            ffmpeg \
            espeak \
            libsndfile1-dev \
            git

      - name: 📥 Clone voice changer
        run: |
          git clone \
            -b master \
            https://github.com/feadxus/voice-changer.git

      - name: 📦 Install Python deps
        working-directory: voice-changer/server
        run: |
          python -m pip install --upgrade pip==23.2.1
          pip install "setuptools<60.0.0" wheel "Cython<3.0.0"
          pip install numpy==1.23.5
          pip install omegaconf==2.0.6
          pip install hydra-core==1.0.7
          pip install fairseq==0.12.2 --no-deps
          pip install pyworld==0.3.3 --no-build-isolation
          pip install -r requirements.txt
          pip cache purge

      - name: 🌐 Build client lib
        working-directory: voice-changer/client/lib
        run: |
          npm install
          npm run build:prod

      # 先编译 demo 生成基础 dist，再补全 Chime 离线资源
      - name: 🌐 Build client demo
        working-directory: voice-changer/client/demo
        run: |
          npm install
          npm run build:prod

      # 📁 按照官方 09_Amazon_Voice_Focus.md 规范完美补全离线资产
      - name: 📁 Copy & Complete Chime Offline Assets
        working-directory: voice-changer
        run: |
          # 1. 创建符合官方 paths 映射规则的目录结构
          mkdir -p client/demo/dist/chime/workers client/demo/public/chime/workers

          # 2. 从 node_modules 提取 WASM 核心及 Worker 依赖
          VOICE_FOCUS=$(find . -type d -path "*/amazon-chime-sdk-js/libs/voicefocus" | head -n 1)
          if [ -n "$VOICE_FOCUS" ]; then
            echo "✅ 复制 node_modules 基础依赖: $VOICE_FOCUS"
            cp -r $VOICE_FOCUS/* client/demo/dist/chime/
            cp -r $VOICE_FOCUS/* client/demo/public/chime/
            # 移动 worker 文件到 workers/ 子目录
            mv client/demo/dist/chime/voicefocus-worker-v1.js client/demo/dist/chime/workers/ 2>/dev/null || true
            mv client/demo/public/chime/voicefocus-worker-v1.js client/demo/public/chime/workers/ 2>/dev/null || true
          fi

          # 3. 补充官方 CDN 部署的 estimator Worker 脚本，打入本地离线包
          echo "⬇️ 自动补全 estimator-v1.js..."
          curl -sSL "https://static.sdkassets.chime.aws/workers/estimator-v1.js" -o client/demo/dist/chime/workers/estimator-v1.js
          cp client/demo/dist/chime/workers/estimator-v1.js client/demo/public/chime/workers/estimator-v1.js

      - name: 🔍 Verify Local Modifications & Assets
        working-directory: voice-changer
        run: |
          echo "================ 1. 检查 TS 源码修改 ================"
          if grep -q "estimator" client/lib/src/VoiceChangerClient.ts; then
            echo "✅ TS 源码修改成功！显式配置了官方指定 paths 路径。"
          else
            echo "❌ 错误：VoiceChangerClient.ts 中未检测到 paths 路径修改！"
            exit 1
          fi

          echo "================ 2. 检查 4 大离线文件完整性 ================"
          if [ -f "client/demo/dist/chime/workers/estimator-v1.js" ] && \
             [ -f "client/demo/dist/chime/workers/voicefocus-worker-v1.js" ] && \
             [ -f "client/demo/dist/chime/voicefocus-v1.wasm" ]; then
            echo "✅ 官方要求的 Voice Focus 离线资源全部准备就绪！"
            ls -la client/demo/dist/chime/
            ls -la client/demo/dist/chime/workers/
          else
            echo "❌ 错误：未能在 dist/chime 中完整集齐 4 个核心离线文件！"
            exit 1
          fi

      - name: 📦 Prepare package
        run: |
          mkdir release
          cp -r voice-changer release/

      - name: 🗜️ Compress
        run: |
          tar -cf voice-changer.tar release
          xz -T0 -9e voice-changer.tar

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-changer
          path: voice-changer.tar.xz

      - name: ☁️ Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: 🔑 rclone config
        env:
          RCLONE_SECRET_DATA: ${{ secrets.GOOGLE_FEADXUS_DRIVE }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_SECRET_DATA" > ~/.config/rclone/rclone.conf

      - name: 🚀 Upload Drive
        run: |
          rclone mkdir feadxus-Google-Drive:/voice-changer
          rclone copy voice-changer.tar.xz feadxus-Google-Drive:/voice-changer/

      - name: ✅ Verify Upload
        run: |
          rclone lsf feadxus-Google-Drive:/voice-changer/
