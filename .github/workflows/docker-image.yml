name: Build Voice Changer Offline

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:

      - name: 📦 Checkout Workflow Repo
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 🔧 Install System Packages
        run: |
          sudo apt update
          sudo apt install -y \
            ffmpeg \
            espeak \
            libsndfile1-dev \
            git

      - name: 📥 Clone voice changer
        run: |
          git clone \
            -b master \
            https://github.com/feadxus/voice-changer.git

      - name: 📦 Install Python deps
        working-directory: voice-changer/server
        run: |
          python -m pip install --upgrade pip==23.2.1
          pip install "setuptools<60.0.0" wheel "Cython<3.0.0"
          pip install numpy==1.23.5
          pip install omegaconf==2.0.6
          pip install hydra-core==1.0.7
          pip install fairseq==0.12.2 --no-deps
          pip install pyworld==0.3.3 --no-build-isolation
          pip install -r requirements.txt
          pip cache purge

      - name: 🌐 Build client lib
        working-directory: voice-changer/client/lib
        run: |
          npm install
          npm run build:prod

      # 先编译 demo 生成基础 dist，再补全 Chime 离线资源
      - name: 🌐 Build client demo
        working-directory: voice-changer/client/demo
        run: |
          npm install
          npm run build:prod

      # 📁 100% 纯本地闭环：直接从本地依赖包搬运全套 Voice Focus 模型资产
      - name: 📁 Package Chime Offline Assets From Node Modules
        working-directory: voice-changer
        run: |
          # 1. 严格重置并创建符合 Chime SDK 预期的本地目录结构
          rm -rf client/demo/dist/chime client/demo/public/chime
          mkdir -p client/demo/dist/chime/workers
          mkdir -p client/demo/dist/chime/wasm
          mkdir -p client/demo/public/chime/workers
          mkdir -p client/demo/public/chime/wasm

          echo "📦 开始从本地 node_modules 提取完整的音频模型资产..."

          # 2. 物理复制：直接把官方内置的所有后台 Worker 脚本搬运过来
          # 包含: estimator-v1.js, voicefocus-worker-v1.js 等
          cp -r client/demo/node_modules/amazon-chime-sdk-js/sys/workers/* client/demo/dist/chime/workers/

          # 3. 物理复制：直接把官方内置的所有 WASM 核心以及你刚才下载失败的 .model 神经网络模型搬运过来
          # 包含: voicefocus-v1.wasm, voicefocus-v1.json, voicefocus-v1.model, 以及 -simd 高级加速版本
          cp -r client/demo/node_modules/amazon-chime-sdk-js/sys/wasm/* client/demo/dist/chime/wasm/

          # 4. 同步到 public 目录，确保本地开发服务器启动时也能通过相对路径访问到
          cp -r client/demo/dist/chime/* client/demo/public/chime/

          echo "✅ 资产搬运完成！"

      - name: 🔍 Verify Local Modifications & Assets
        working-directory: voice-changer
        run: |
          echo "================ 1. 检查 TS 源码修改 ================"
          if grep -q "estimator" client/lib/src/VoiceChangerClient.ts; then
            echo "✅ TS 源码修改成功！"
          else
            echo "❌ 错误：VoiceChangerClient.ts 未检测到 paths 修改！"
            exit 1
          fi

          echo "================ 2. 检查 4 大离线文件完整性 ================"
          if [ -f "client/demo/dist/chime/workers/estimator-v1.js" ] && \
             [ -f "client/demo/dist/chime/workers/voicefocus-worker-v1.js" ] && \
             [ -f "client/demo/dist/chime/voicefocus-v1.wasm" ] && \
             [ -f "client/demo/dist/chime/voicefocus-v1-simd.wasm" ]; then
            echo "🎉 4 大离线文件已全部成功下载并集齐！"
            ls -la client/demo/dist/chime/
            ls -la client/demo/dist/chime/workers/
          else
            echo "❌ 错误：4 大核心离线文件依然未找齐！"
            exit 1
          fi

      - name: 📦 Prepare package
        run: |
          mkdir release
          cp -r voice-changer release/

      - name: 🗜️ Compress
        run: |
          tar -cf voice-changer.tar release
          xz -T0 -9e voice-changer.tar

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-changer
          path: voice-changer.tar.xz

      - name: ☁️ Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: 🔑 rclone config
        env:
          RCLONE_SECRET_DATA: ${{ secrets.GOOGLE_FEADXUS_DRIVE }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_SECRET_DATA" > ~/.config/rclone/rclone.conf

      - name: 🚀 Upload Drive
        run: |
          rclone mkdir feadxus-Google-Drive:/voice-changer
          rclone copy voice-changer.tar.xz feadxus-Google-Drive:/voice-changer/

      - name: ✅ Verify Upload
        run: |
          rclone lsf feadxus-Google-Drive:/voice-changer/
