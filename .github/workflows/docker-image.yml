name: Build Voice Changer Offline

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:

      - name: 📦 Checkout Workflow Repo
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 🔧 Install System Packages
        run: |
          sudo apt update
          sudo apt install -y \
            ffmpeg \
            espeak \
            libsndfile1-dev \
            git

      - name: 📥 Clone voice changer
        run: |
          git clone \
            -b master \
            https://github.com/feadxus/voice-changer.git

      - name: 📦 Install Python deps
        working-directory: voice-changer/server
        run: |
          python -m pip install --upgrade pip==23.2.1
          pip install "setuptools<60.0.0" wheel "Cython<3.0.0"
          pip install numpy==1.23.5
          pip install omegaconf==2.0.6
          pip install hydra-core==1.0.7
          pip install fairseq==0.12.2 --no-deps
          pip install pyworld==0.3.3 --no-build-isolation
          pip install -r requirements.txt
          pip cache purge

      - name: 🌐 Build client lib
        working-directory: voice-changer/client/lib
        run: |
          npm install
          npm run build:prod

      # 📁 复制 node_modules 资产并在构建期补全 Worker 脚本
      - name: 📁 Copy & Complete Chime Assets
        working-directory: voice-changer
        run: |
          # 1. 创建符合 Chime SDK 规则的目录结构
          mkdir -p client/demo/dist/chime/workers client/demo/public/chime/workers
          
          # 2. 从 node_modules 复制本地 wasm 及核心库文件
          CHIME_DIR=$(find . -type d -path "*/amazon-chime-sdk-js/libs/voicefocus" | head -n 1)
          if [ -n "$CHIME_DIR" ]; then
            echo "✅ 拷贝 node_modules 核心依赖文件: $CHIME_DIR"
            cp -r $CHIME_DIR/* client/demo/dist/chime/
            cp -r $CHIME_DIR/* client/demo/public/chime/
          fi

          # 3. 补全 npm 包未内置的 estimator Worker 脚本（打入离线包）
          echo "⬇️ 自动补全 estimator-v1.js 离线资源..."
          curl -sSL "https://static.sdkassets.chime.aws/workers/estimator-v1.js" -o client/demo/dist/chime/workers/estimator-v1.js
          cp client/demo/dist/chime/workers/estimator-v1.js client/demo/public/chime/workers/estimator-v1.js

      - name: 🔍 Verify Local Modifications & Assets
        working-directory: voice-changer
        run: |
          echo "================ 1. 检查 VoiceChangerClient.ts 源码修改 ================"
          if grep -q "assetGroup" client/lib/src/VoiceChangerClient.ts; then
            echo "✅ TS 源码修改成功！包含了 assetGroup 配置。"
          else
            echo "❌ 错误：VoiceChangerClient.ts 未检测到修改！"
            exit 1
          fi

          echo "================ 2. 检查 Chime 本地静态资源拷贝 ================"
          if [ -f "client/demo/dist/chime/workers/estimator-v1.js" ]; then
            echo "✅ 离线文件全部准备就绪！"
            ls -la client/demo/dist/chime/workers/
          else
            echo "❌ 错误：未找到 estimator-v1.js 文件！"
            exit 1
          fi

      - name: 🌐 Build client demo
        working-directory: voice-changer/client/demo
        run: |
          npm install
          # 使用 build:prod 触发 package.json 中配置的 copy:chime 及完整编译
          npm run build:prod

      # 🔍 新增：定向检查你的修改与静态资源抽取是否生效
      - name: 🔍 Verify Local Modifications & Assets
        working-directory: voice-changer
        run: |
          echo "================ 1. 检查 VoiceChangerClient.ts 源码修改 ================"
          if grep -q "assetGroup" client/lib/src/VoiceChangerClient.ts; then
            echo "✅ TS 源码修改成功！包含了 assetGroup 配置。"
          else
            echo "❌ 错误：VoiceChangerClient.ts 中未检测到 assetGroup 修改！"
            exit 1
          fi

          echo "================ 2. 检查 Chime 本地静态资源拷贝 ================"
          # 修改为使用 find 递归查找，兼容 workers/ 子目录结构
          if [ -n "$(find client/demo/public/chime client/demo/dist/chime -name 'estimator-v1.js' 2>/dev/null)" ]; then
            echo "✅ Chime 静态资源成功拷贝到了本地 chime 目录！"
            find client/demo/public/chime client/demo/dist/chime -name "estimator-v1.js"
          else
            echo "❌ 错误：未在 public/chime 或 dist/chime 找到 estimator-v1.js 文件！"
            exit 1
          fi

          echo "================ 3. 检查打包编译产物 index.js ================"
          if grep -q "estimator-v1.js" client/demo/dist/index.js; then
            echo "✅ 编译后的前端 dist/index.js 已引入本地路径！"
          else
            echo "⚠️ 警告：编译产物中未直接搜索到 estimator-v1.js 字符串，属于正常现象（内部通过路径拼接）。"
          fi

      - name: 📦 Prepare package
        run: |
          mkdir release
          cp -r voice-changer release/

      - name: 🗜️ Compress
        run: |
          tar -cf voice-changer.tar release
          xz -T0 -9e voice-changer.tar

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-changer
          path: voice-changer.tar.xz

      - name: ☁️ Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: 🔑 rclone config
        env:
          RCLONE_SECRET_DATA: ${{ secrets.GOOGLE_FEADXUS_DRIVE }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_SECRET_DATA" > ~/.config/rclone/rclone.conf

      - name: 🚀 Upload Drive
        run: |
          rclone mkdir feadxus-Google-Drive:/voice-changer
          rclone copy voice-changer.tar.xz feadxus-Google-Drive:/voice-changer/

      - name: ✅ Verify Upload
        run: |
          rclone lsf feadxus-Google-Drive:/voice-changer/
